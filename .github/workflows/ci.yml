name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run unit tests
        run: mvn test

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      - name: Configure Podman for Testcontainers
        run: |
          socket_path="/run/user/$(id -u)/podman/podman.sock"
          # Start the Podman socket; fall back to podman system service if systemctl fails
          systemctl --user start podman.socket \
            || podman system service --time=0 "unix://$socket_path" &
          # Wait up to 30 s for the socket file to actually appear
          timeout 30 bash -c "until [ -S '$socket_path' ]; do sleep 1; done"
          echo "DOCKER_HOST=unix://$socket_path" >> "$GITHUB_ENV"
          echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: mvn verify -DskipITs=false
